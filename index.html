<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sori CCFolia Backup</title>
    <link rel="icon" type="image/png" href="fav.png">
    <style>
        /* ==========================================
           [1] 기본 스타일 및 테마 변수 정의
        ========================================== */
        :root {
            --bg-body: #0f111a;
            --bg-container: #1e1e1e;
            --bg-bubble: #141414;
            --bg-dice: #2a2a2a;
            --bg-narration: #2d2d2d;
            --text-main: #e0e0e0;
            --text-bubble: #dddddd;
            --text-narration: #ffffff;
            --text-dice: #ffffff;
        }

        /* 라이트 모드 */
        body.light-theme-view {
            --bg-body: #f0f2f5;
            --bg-container: #ffffff;
            --bg-bubble: #f1f3f5;
            --bg-dice: #e9ecef;
            --bg-narration: #e2e6ea;
            --text-main: #212529;
            --text-bubble: #343a40;
            --text-narration: #1a1d20;
            --text-dice: #1a1d20;
        }

        body { background-color: var(--bg-body); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; transition: background-color 0.2s, color 0.2s; }

        /* 프리뷰 영역 배치 (툴바가 sticky라서 위 여백 계산이 필요 없음) */
        .preview-area { padding: 20px; }

        .status-message { text-align: center; margin-top: 100px; color: #4dadff; font-size: 17px; line-height: 1.6; }
        .notice-banner {
            max-width: 800px; margin: 0 auto; padding: 10px 14px; box-sizing: border-box;
            border-radius: 8px; background: rgba(77, 173, 255, 0.1); border: 1px solid rgba(77, 173, 255, 0.35);
            color: #4dadff; font-size: 13px; line-height: 1.5;
        }

        p.message-bubble { position: relative; }
        .bubble-wrapper { position: relative; display: flex; align-items: center; gap: 8px; max-width: 100%; }
        .bubble-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; }
        .bubble-wrapper:hover .bubble-actions { opacity: 1; }

        .action-mini-btn { background: #252940; color: #8f95b2; border: 1px solid #3b4260; padding: 2px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; transition: 0.1s; }
        .action-mini-btn:hover { color: #fff; background: #4dadff; border-color: #4dadff; }
        .action-mini-btn.delete-btn:hover { background: #901a1a; border-color: #ff4d4d; color: #fff; }

        /* ==========================================
           [2] 상단 고정 툴바
        ========================================== */
        .toolbar {
            position: sticky;   /* [수정] fixed → sticky: 툴바 높이가 바뀌어도 프리뷰를 가리지 않음 */
            top: 0;
            min-height: 80px;
            background: rgba(24, 28, 41, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-wrap: wrap;    /* 창이 좁으면 자연스럽게 줄바꿈 */
            align-items: center;
            justify-content: space-between;
            gap: 12px 24px;
            padding: 12px 40px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 1000;
            box-sizing: border-box;
        }

        .toolbar h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #4dadff, #7df9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(77, 173, 255, 0.2);
            letter-spacing: 0.5px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .controls-group { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .control-item { display: flex; flex-direction: column; gap: 6px; font-size: 11px; color: #8f95b2; }
        .control-item strong { color: #fff; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }

        select, input[type="file"] {
            background: #1e2235;
            color: #ffffff;
            border: 1px solid #333955;
            padding: 0px 14px;
            height: 36px;
            box-sizing: border-box;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            transition: all 0.2s ease;
            line-height: 34px;
        }
        select:focus, input[type="file"]:hover { border-color: #4dadff; box-shadow: 0 0 8px rgba(77, 173, 255, 0.25); }
        select:disabled { background: #141622; color: #555a77; border-color: #222538; cursor: not-allowed; }

        /* [v4.2] 나레이션 다중 선택 드롭다운 */
        .custom-dropdown { position: relative; width: 180px; }
        .dropdown-button {
            width: 100%; height: 36px; box-sizing: border-box;
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            background: #1e2235; color: #ffffff; border: 1px solid #333955; border-radius: 6px;
            padding: 0 12px; font-size: 12px; cursor: pointer; transition: all 0.2s ease; text-align: left;
        }
        .dropdown-button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dropdown-button .arrow { font-size: 9px; color: #8f95b2; transition: transform 0.2s; flex-shrink: 0; }
        .custom-dropdown.open .arrow { transform: rotate(180deg); }
        .dropdown-button:hover:not(:disabled), .custom-dropdown.open .dropdown-button { border-color: #4dadff; box-shadow: 0 0 8px rgba(77, 173, 255, 0.25); }
        .dropdown-button:disabled { background: #141622; color: #555a77; border-color: #222538; cursor: not-allowed; }
        .dropdown-menu {
            display: none; position: absolute; top: calc(100% + 6px); left: 0; min-width: 100%;
            max-height: 260px; overflow-y: auto; box-sizing: border-box; padding: 6px;
            background: #1e2235; border: 1px solid #333955; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); z-index: 1100;
        }
        .custom-dropdown.open .dropdown-menu { display: block; }
        .dropdown-item { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 4px; color: #e2e8f0; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .dropdown-item:hover { background: #2a3050; }
        .dropdown-item input { accent-color: #4dadff; margin: 0; cursor: pointer; }
        .dropdown-empty { padding: 8px; color: #8f95b2; font-size: 12px; }
        .dropdown-hint { margin-top: 4px; padding: 6px 8px 2px; border-top: 1px solid #333955; color: #6f7594; font-size: 11px; white-space: nowrap; }

        /* [v4.3] 툴바의 이미지 설정 버튼 */
        .image-panel-btn { width: 180px; justify-content: center; }

        /* [v4.3] 프리뷰의 이미지 칸 + 🖼 바꾸기 버튼 */
        #output-wrapper .avatar-box { position: relative; }
        .avatar-change-btn {
            position: absolute; right: 3px; bottom: 3px; z-index: 1;
            width: 24px; height: 24px; padding: 0; border: none; border-radius: 50%;
            background: rgba(20, 22, 34, 0.85); color: #fff; font-size: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
        }
        #output-wrapper .avatar-box:hover .avatar-change-btn { opacity: 1; }
        @media (hover: none) { .avatar-change-btn { opacity: 0.8; } } /* 터치 화면에서는 항상 보이게 */

        /* [v4.3] 🖼 버튼을 누르면 나오는 메뉴 */
        .avatar-menu {
            position: fixed; display: none; flex-direction: column; min-width: 180px; padding: 6px;
            background: #1e2235; border: 1px solid #333955; border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); z-index: 2200;
        }
        .avatar-menu.open { display: flex; }
        .avatar-menu button {
            background: none; border: none; color: #e2e8f0; text-align: left;
            padding: 8px 10px; border-radius: 4px; font-size: 12px; cursor: pointer;
        }
        .avatar-menu button:hover { background: #2a3050; }
        .avatar-menu-hint { padding: 6px 10px 2px; margin-top: 4px; border-top: 1px solid #333955; color: #6f7594; font-size: 11px; }

        /* [v4.3] 캐릭터 이미지 설정 패널 (오른쪽에서 열림) */
        .image-panel {
            position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 100vw;
            display: flex; flex-direction: column; box-sizing: border-box;
            background: #141622; border-left: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.5); z-index: 2100;
            transform: translateX(105%); transition: transform 0.25s ease;
        }
        .image-panel.open { transform: none; }
        .image-panel-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); color: #fff; font-size: 14px;
        }
        .image-panel-close { background: none; border: none; color: #8f95b2; font-size: 18px; cursor: pointer; }
        .image-panel-close:hover { color: #fff; }
        .image-panel-body {
            flex: 1; overflow-y: auto; padding: 16px 20px 40px;
            display: flex; flex-direction: column; gap: 14px; color: #bcbfc4; font-size: 12px;
        }
        #image-panel-list { display: flex; flex-direction: column; gap: 14px; }
        .panel-box, .char-card {
            display: flex; flex-direction: column; gap: 10px; padding: 12px 14px;
            background: #1e2235; border: 1px solid #333955; border-radius: 10px;
        }
        .panel-slider-row { display: flex; flex-direction: column; gap: 4px; }
        .panel-slider-row label { display: flex; justify-content: space-between; color: #e2e8f0; }
        .panel-slider-row .val { color: #4dadff; }
        .panel-slider-row input[type="range"] { width: 100%; margin: 0; accent-color: #4dadff; cursor: pointer; }
        .panel-hint { margin: 0; color: #6f7594; font-size: 11px; line-height: 1.5; }
        .char-card-head { display: flex; align-items: center; justify-content: space-between; }
        .char-card-name { font-weight: 700; font-size: 13px; }
        .mini-link { background: none; border: none; color: #8f95b2; font-size: 11px; cursor: pointer; text-decoration: underline; }
        .mini-link:hover { color: #fff; }
        .char-card-main { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
        .focus-picker {
            position: relative; display: inline-block; line-height: 0; border-radius: 6px; overflow: hidden;
            cursor: crosshair; touch-action: none;
            background: repeating-conic-gradient(#2a2f48 0 25%, #20243a 0 50%) 0 0 / 12px 12px;
        }
        .focus-picker img { display: block; max-width: 150px; max-height: 170px; pointer-events: none; user-select: none; }
        .focus-dot {
            position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%;
            border: 2px solid #fff; background: rgba(77, 173, 255, 0.7); box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.4);
            pointer-events: none; box-sizing: border-box;
        }
        .no-image {
            width: 150px; height: 90px; display: flex; align-items: center; justify-content: center;
            border: 1px dashed #333955; border-radius: 6px; color: #555a77;
        }
        .char-card-result { display: flex; flex-direction: column; gap: 4px; color: #6f7594; font-size: 11px; }
        .char-card-result .avatar-box { margin-right: 0; background: #141414; }
        .char-card-btns { display: flex; gap: 8px; }
        .panel-btn {
            flex: 1; padding: 7px; border-radius: 6px; font-size: 12px; cursor: pointer;
            background: #252940; color: #e2e8f0; border: 1px solid #3b4260;
        }
        .panel-btn:hover { border-color: #4dadff; color: #fff; }

        .btn-group { display: flex; gap: 12px; }
        .btn { border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 12px; transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0;}

        .btn-download { background: linear-gradient(135deg, #4dadff, #2575fc); color: #ffffff; box-shadow: 0 4px 15px rgba(77, 173, 255, 0.3); }
        .btn-download:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(77, 173, 255, 0.45); }

        .btn-copy { background: #252940; color: #e2e8f0; border: 1px solid #3b4260; }
        .btn-copy:hover:not(:disabled) { background: #2e3454; color: #ffffff; border-color: #4dadff; }

        .btn:disabled { background: #1b1e2e; color: #4a4f6e; border: 1px solid #25283d; box-shadow: none; transform: none; cursor: not-allowed; }

        /* ==========================================
           [3] 우측 하단 고정형 도움말 및 패치노트 UI
        ========================================== */
        .info-panel-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 2000;
            font-family: 'Pretendard', sans-serif;
        }
        .info-toggle-btn {
            background: linear-gradient(135deg, #4dadff, #2575fc);
            color: #ffffff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(77, 173, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .info-toggle-btn:hover {
            transform: scale(1.1) rotate(15deg);
            box-shadow: 0 6px 20px rgba(77, 173, 255, 0.6);
        }
        .info-card {
            position: absolute;
            bottom: 65px;
            right: 0;
            width: 350px;
            max-height: 500px;
            background: #141622;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: fadeInUp 0.25s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .info-tabs {
            display: flex;
            background: #1e2235;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }
        .info-tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #8f95b2;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .info-tab-btn.active {
            color: #4dadff;
            background: #141622;
            border-bottom: 2px solid #4dadff;
        }
        .info-content-wrap {
            padding: 20px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.6;
            color: #bcbfc4;
        }
        .info-content { display: none; }
        .info-content.active { display: block; }
        .info-content ol { margin: 0; padding-left: 18px; }
        .info-content li { margin-bottom: 8px; }
        .info-content li strong { color: #ffffff; }

        .patch-item {
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding-bottom: 12px;
        }
        .patch-item:last-child { border: none; margin: 0; padding: 0; }
        .patch-version {
            font-weight: bold;
            color: #4dadff;
            font-size: 14px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }
        .patch-date { font-size: 11px; color: #555a77; font-weight: normal; }
        .patch-item ul { margin: 4px 0 0 0; padding-left: 16px; color: #9fa3af; font-size: 12.5px; }

        /* ==========================================
           반응형 (창이 좁아질 때)
        ========================================== */
        @media (max-width: 950px) {
            .toolbar {
                flex-direction: column;
                padding: 15px 20px;
                align-items: stretch;
            }

            .toolbar h2 {
                text-align: center;
                font-size: 16px;
            }

            .controls-group {
                gap: 12px;
                justify-content: space-between;
            }

            .control-item {
                flex: 1;
                min-width: 140px;
            }

            .custom-dropdown, .image-panel-btn { width: 100%; }

            select, input[type="file"], .dropdown-button {
                width: 100%;
                box-sizing: border-box;
                padding: 0px 10px;
                height: 32px;
                font-size: 11px;
                line-height: 30px;
            }

            .btn-group {
                justify-content: center;
                width: 100%;
            }

            .btn {
                flex: 1;
                justify-content: center;
                padding: 8px 12px;
                font-size: 11px;
            }
        }

        /* 스마트폰 세로 모드처럼 아주 좁을 때 (500px 이하) */
        @media (max-width: 500px) {
            .toolbar { position: relative; } /* 툴바가 화면을 너무 많이 가리지 않게 */

            .controls-group {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .info-card {
                width: calc(100vw - 48px);
                right: 0;
            }
        }
    </style>
    <style id="dynamic-log-style"></style>
</head>
<body>

    <div class="toolbar">
        <h2>Sori CCFolia Backup</h2>
        <div class="controls-group">
            <div class="control-item">
                <strong>1. 로그 파일 업로드</strong>
                <input type="file" id="html-file-picker" accept=".html,.htm,.json,.zip">
            </div>
            <div class="control-item">
                <strong>2. 나레이션 캐릭터 지정</strong>
                <div class="custom-dropdown" id="narration-dropdown">
                    <button type="button" class="dropdown-button" id="dropdown-btn" disabled>
                        <span id="dropdown-label">-- 파일 먼저 업로드 --</span>
                        <span class="arrow">▼</span>
                    </button>
                    <div class="dropdown-menu" id="dropdown-menu">
                        <!-- JS에서 체크박스 목록이 생성됩니다 -->
                    </div>
                </div>
            </div>
            <div class="control-item">
                <strong>3. 테마 선택</strong>
                <select id="theme-select" disabled>
                    <option value="dark">다크 모드</option>
                    <option value="light">라이트 모드</option>
                </select>
            </div>
            <div class="control-item">
                <strong>4. 캐릭터 이미지</strong>
                <button type="button" class="dropdown-button image-panel-btn" id="image-panel-btn" disabled>
                    <span>🖼 확대·이미지 설정</span>
                </button>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn btn-copy" id="copy-btn" disabled>📋 HTML 코드 복사</button>
            <button class="btn btn-download" id="download-btn" disabled>💾 HTML 다운로드</button>
        </div>
    </div>

    <div class="preview-area">
        <div id="output-wrapper">
            <h3 class="status-message">📂 상단에서 코코포리아 로그 파일을 업로드해 주세요.<br><small>HTML · JSON · ZIP 모두 가능해요</small></h3>
        </div>
    </div>

    <!-- [v4.3] 캐릭터 이미지 설정 패널 -->
    <div class="image-panel" id="image-panel">
        <div class="image-panel-header">
            <strong>🖼 캐릭터 이미지 설정</strong>
            <button type="button" class="image-panel-close" id="image-panel-close" title="닫기">✕</button>
        </div>
        <div class="image-panel-body">
            <div class="panel-box">
                <p class="panel-hint">
                    설정은 <strong>캐릭터 이름별로 저장</strong>돼서, 다음에 같은 이름이 나오는 로그를 올려도 그대로 적용돼요.<br>
                    왼쪽 이미지를 클릭하거나 끌면 <strong>확대해서 보여줄 위치</strong>(예: 얼굴)를 고를 수 있어요.
                </p>
            </div>
            <div id="image-panel-list"></div>
        </div>
    </div>

    <!-- [v4.3] 프리뷰의 🖼 버튼 메뉴 -->
    <div class="avatar-menu" id="avatar-menu">
        <button type="button" data-action="file">📁 파일에서 선택</button>
        <button type="button" data-action="url">🔗 이미지 주소 입력</button>
        <button type="button" data-action="reset">↩ 원래 이미지로</button>
        <div class="avatar-menu-hint">이 묶음의 이미지만 바뀌어요</div>
    </div>
    <input type="file" id="image-file-picker" accept="image/*" hidden>

    <div class="info-panel-container">
        <button class="info-toggle-btn" id="info-master-btn" onclick="toggleInfoCard()">💡</button>

        <div class="info-card" id="info-main-card">
            <div class="info-tabs">
                <button class="info-tab-btn active" onclick="switchInfoTab(0)">📘 도움말</button>
                <button class="info-tab-btn" onclick="switchInfoTab(1)">📜 업데이트 기록</button>
            </div>

            <div class="info-content-wrap">
                <div class="info-content active" id="tab-content-help">
                    <ol id="help-list-target"></ol>
                </div>

                <div class="info-content" id="tab-content-patch">
                    <div id="patch-list-target"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="info-data.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof COMMON_LOG_STYLE !== 'undefined') {
                document.getElementById('dynamic-log-style').innerHTML = COMMON_LOG_STYLE;
            }
            renderHelp();
            renderPatchNotes();
        });

        function renderHelp() {
            const target = document.getElementById('help-list-target');
            if (target && typeof HELP_DATA !== 'undefined') {
                target.innerHTML = HELP_DATA.map(item => `<li>${item.text}</li>`).join('');
            }
        }

        function renderPatchNotes() {
            const target = document.getElementById('patch-list-target');
            target.innerHTML = PATCH_DATA.map(item => `
                <div class="patch-item">
                    <div class="patch-version">${item.version} <span class="patch-date">${item.date}</span></div>
                    <ul>
                        ${item.changes.map(change => `<li>${change}</li>`).join('')}
                    </ul>
                </div>
            `).join('');
        }

        function toggleInfoCard() {
            const card = document.getElementById('info-main-card');
            const btn = document.getElementById('info-master-btn');
            if (card.style.display === 'flex') {
                card.style.display = 'none';
                btn.innerText = '💡';
            } else {
                card.style.display = 'flex';
                btn.innerText = '❌';
            }
        }

        function switchInfoTab(index) {
            const tabs = document.querySelectorAll('.info-tab-btn');
            const contents = document.querySelectorAll('.info-content');

            tabs.forEach((tab, i) => {
                if (i === index) {
                    tab.classList.add('active');
                    contents[i].classList.add('active');
                } else {
                    tab.classList.remove('active');
                    contents[i].classList.remove('active');
                }
            });
        }
    </script>
